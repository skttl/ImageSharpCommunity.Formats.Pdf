name: Release Package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, including v prefix
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Select package and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Expected a v release tag" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          PROJECT="src/ImageSharpCommunity.Formats.Pdf/ImageSharpCommunity.Formats.Pdf.csproj"
          PACKAGE_ID="ImageSharpCommunity.Formats.Pdf"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack release
        run: dotnet pack "$PROJECT" --configuration Release -p:Version="$VERSION" --output ./artifacts
      - name: NuGet login with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: skttl
      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/${PACKAGE_ID}.${VERSION}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate --source https://api.nuget.org/v3/index.json
